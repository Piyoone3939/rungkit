  <symbol id="p-counter" viewBox="0 0 24 24"><path d="M1 12h2.5M20.5 12H23" stroke="var(--rail)" stroke-width="1.8" stroke-linecap="round" fill="none"/><rect x="3.5" y="4" width="17" height="16" rx="2.5" fill="url(#g-steel)" stroke="rgba(0,0,0,.38)" stroke-width=".8"/><rect x="5.5" y="8" width="13" height="8" rx="1.2" fill="url(#g-dark)"/><text x="12" y="14.4" text-anchor="middle" font-size="6.4" font-weight="700" fill="#6fd6a0" font-family="Consolas, monospace">123</text></symbol>
  <symbol id="p-cmp" viewBox="0 0 24 24"><path d="M1 12h2.5M20.5 12H23" stroke="var(--rail)" stroke-width="1.8" stroke-linecap="round" fill="none"/><rect x="3.5" y="5" width="17" height="14" rx="2" fill="url(#g-steel)" stroke="rgba(0,0,0,.38)" stroke-width=".8"/><path d="M8.5 8.2 15.5 11.2 8.5 14.2" fill="none" stroke="url(#g-blue-d)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 16.4h7" stroke="url(#g-blue-d)" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<header class="titlebar">
  <div class="brand"><svg class="logo"><use href="#i-logo"/></svg><strong>rungkit</strong></div>
  <span class="tb-sep"></span>
  <div class="doctab" title="">
    <svg><use href="#i-doc"/></svg><span id="docname">program.ldt</span>
  </div>
  <span class="tagline" data-i18n="tagline">ラダーをテキストで書き、その場で図と動作を確かめる</span>
  <div class="title-actions">
    <button id="lang" class="tb-btn" title="日本語 / English">EN</button>
    <button id="theme" class="tb-btn icon" aria-label="theme"><svg><use href="#i-sun"/></svg></button>
    <a class="tb-btn icon" href="https://github.com/Piyoone3939/rungkit" aria-label="GitHub" title="GitHub"><svg><use href="#i-github"/></svg></a>
    <span id="ver" class="ver"></span>
  </div>
</header>

<nav class="ribbon" aria-label="tools">
  <div class="ribbon-tabs" role="tablist">
    <button class="rtab active" data-tab="ladder" role="tab" data-i18n="tabLadder">ラダー</button>
    <button class="rtab" data-tab="sim" role="tab" data-i18n="tabSim">シミュレーション</button>
    <button class="rtab" data-tab="io" role="tab" data-i18n="tabIo">ファイル・書き出し</button>
  </div>
  <div class="ribbon-body">
    <div class="group" data-tab="ladder">
      <div class="group-body edit-bar" role="toolbar" aria-label="edit">
        <button class="tool" data-act="addRung"><svg><use href="#i-rung-add"/></svg><span data-i18n="addRung">ラング追加</span></button>
        <button class="tool" data-act="before" data-need="elem"><svg><use href="#i-before"/></svg><span data-i18n="before">前に条件</span></button>
        <button class="tool" data-act="after" data-need="elem"><svg><use href="#i-after"/></svg><span data-i18n="after">後に条件</span></button>
        <button class="tool" data-act="parallel" data-need="elem"><svg><use href="#i-parallel"/></svg><span data-i18n="parallel">並列に追加</span></button>
        <span class="group-gap"></span>
        <button class="tool" data-act="replace" data-need="elem"><svg><use href="#i-replace"/></svg><span data-i18n="replace">置き換え</span></button>
        <button class="tool" data-act="operand" data-need="elem"><svg><use href="#i-device"/></svg><span data-i18n="operand">デバイス変更</span></button>
        <span class="group-gap"></span>
        <button class="tool" data-act="delete" data-need="elem"><svg><use href="#i-delete"/></svg><span data-i18n="delete">削除</span></button>
        <button class="tool" data-act="deleteRung" data-need="rung"><svg><use href="#i-rung-del"/></svg><span data-i18n="deleteRung">ラング削除</span></button>
        <button class="tool" data-act="undo" id="undo"><svg><use href="#i-undo"/></svg><span data-i18n="undo">元に戻す</span></button>
      </div>
      <div class="group-names"><span data-i18n="gCreate">作成</span><span data-i18n="gModify">変更</span><span data-i18n="gRemove">削除・履歴</span></div>
    </div>
    <div class="group" data-tab="ladder">
      <div class="group-body">
        <button id="fmt" class="tool"><svg><use href="#i-format"/></svg><span data-i18n="format">整形</span></button>
      </div>
      <div class="group-names"><span data-i18n="gText">テキスト</span></div>
    </div>

    <div class="group" data-tab="sim" hidden>
      <div class="group-body">
        <button id="runR" class="tool"><svg class="ic-run"><use href="#i-play"/></svg><span data-i18n="run">実行</span></button>
        <button id="traceR" class="tool toggle" aria-pressed="false"><svg><use href="#i-trace"/></svg><span data-i18n="trace">記録を表示</span></button>
      </div>
      <div class="group-names"><span data-i18n="gScenario">シナリオ</span></div>
    </div>

    <div class="group" data-tab="io" hidden>
      <div class="group-body">
        <label class="field"><span class="sr" data-i18n="example">例</span>
          <select id="example">
            <option value="" data-i18n="example">例を開く</option>
            <option value="conveyor" data-i18n="exConveyor">コンベア（三菱）</option>
            <option value="melsec-semantics" data-i18n="exVerify">三菱の動作確認用</option>
            <option value="iec" data-i18n="exIec">IEC の例</option>
          </select>
        </label>
        <button id="open" class="tool"><svg><use href="#i-open"/></svg><span data-i18n="open">開く</span></button>
        <input id="file" type="file" accept=".ldt,.json,.xml" hidden>
        <button id="save" class="tool"><svg><use href="#i-save"/></svg><span data-i18n="save">.ldt を保存</span></button>
      </div>
      <div class="group-names"><span data-i18n="gFile">ファイル</span></div>
    </div>
    <div class="group" data-tab="io" hidden>
      <div class="group-body">
        <label class="field"><span class="sr" data-i18n="export">書き出し</span><select id="format" aria-label="export format"></select></label>
        <button id="export" class="tool"><svg><use href="#i-export"/></svg><span data-i18n="export">書き出し</span></button>
      </div>
      <div class="group-names"><span data-i18n="gExport">書き出し</span></div>
    </div>
  </div>
</nav>

<main class="workspace">
  <section class="panel editor">
    <div class="panel-head">
      <span class="panel-title" data-i18n="browser">ブラウザ</span>
      <div class="seg" role="tablist">
        <button class="seg-btn active" data-pane="text" data-i18n="paneText">テキスト</button>
        <button class="seg-btn" data-pane="tree" data-i18n="paneTree">構成</button>
      </div>
    </div>
    <div class="pane-text">
      <textarea id="src" spellcheck="false" wrap="off" aria-label="program"></textarea>
      <ul id="diags" class="diags" aria-live="polite"></ul>
    </div>
    <div class="pane-tree" hidden><ul id="tree" class="tree"></ul></div>
  </section>

  <section class="canvas drawing" aria-label="ladder">
    <div class="viewport-head">
      <span class="hint" data-i18n="clickHint">要素をクリックして選び、上のボタンで編集します</span>
      <span id="sel" class="sel"></span>
    </div>
    <div class="palette" role="toolbar" aria-label="parts">
      <div class="palette-title" data-i18n="parts">部品</div>
      <button class="part" draggable="true" data-part="no" data-i18n-title="pNo"><svg><use href="#p-no"/></svg></button>
      <button class="part" draggable="true" data-part="nc" data-i18n-title="pNc"><svg><use href="#p-nc"/></svg></button>
      <button class="part" draggable="true" data-part="rise" data-i18n-title="pRise"><svg><use href="#p-rise"/></svg></button>
      <button class="part" draggable="true" data-part="fall" data-i18n-title="pFall"><svg><use href="#p-fall"/></svg></button>
      <button class="part" draggable="true" data-part="cmp" data-i18n-title="pCmp"><svg><use href="#p-cmp"/></svg></button>
      <span class="palette-sep"></span>
      <button class="part" draggable="true" data-part="out" data-i18n-title="pOut"><svg><use href="#p-coil"/></svg></button>
      <button class="part" draggable="true" data-part="set" data-i18n-title="pSet"><svg><use href="#p-set"/></svg></button>
      <button class="part" draggable="true" data-part="rst" data-i18n-title="pRst"><svg><use href="#p-rst"/></svg></button>
      <button class="part" draggable="true" data-part="ton" data-i18n-title="pTon"><svg><use href="#p-timer"/></svg></button>
      <button class="part" draggable="true" data-part="ctu" data-i18n-title="pCtu"><svg><use href="#p-counter"/></svg></button>
    </div>
    <div id="svg" class="svg" tabindex="0"></div>
    <div class="viewbar" role="toolbar" aria-label="view">
      <button id="zoomOut" class="vb" data-i18n-title="zoomOut"><svg><use href="#i-zoom-out"/></svg></button>
      <button id="zoomReset" class="vb pct">100%</button>
      <button id="zoomIn" class="vb" data-i18n-title="zoomIn"><svg><use href="#i-zoom-in"/></svg></button>
      <span class="vb-sep"></span>
      <button id="zoomFit" class="vb" data-i18n-title="zoomFit"><svg><use href="#i-fit"/></svg></button>
    </div>
    <div id="droptip" class="droptip" hidden></div>
  </section>

  <section class="panel dock scenario">
    <div class="panel-head">
      <span class="panel-title" data-i18n="scenario">シナリオ（.ldtest）</span>
      <span id="summary" class="summary"></span>
      <label class="check"><input id="trace" type="checkbox"> <span data-i18n="trace">記録を表示</span></label>
      <button id="run" class="primary"><svg><use href="#i-play"/></svg><span data-i18n="run">実行</span></button>
    </div>
    <div class="scenario-body">
      <textarea id="scn" spellcheck="false" wrap="off" aria-label="scenario"></textarea>
      <div id="results" class="results" aria-live="polite"></div>
    </div>
  </section>
</main>

<div id="toast" class="toast" role="alert" hidden></div>

<dialog id="ask" class="ask">
  <form method="dialog">
    <label for="ask-input" id="ask-label"></label>
    <input id="ask-input" autocomplete="off" spellcheck="false">
    <p id="ask-hint" class="ask-hint"></p>
    <div class="ask-actions">
      <button value="cancel" formnovalidate data-i18n="cancel">やめる</button>
      <button value="ok" class="primary" data-i18n="ok">OK</button>
    </div>
  </form>
</dialog>

<footer class="statusbar">
  <span class="dot" id="dot"></span>
  <span id="status" class="status"></span>
  <span class="spacer"></span>
  <span class="foot-note" data-i18n="foot">ブラウザの中だけで動きます。入力はこの端末に保存されます。</span>
</footer>

<script src="wasm_exec.js"></script>
<script src="app.js"></script>
</body>
</html>
